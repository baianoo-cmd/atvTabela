<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>

        <h1>Cadastro</h1>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>


        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>


        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" minlength="8" required>


        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>


        <p>Gênero:</p>

        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label>

        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>


        <p>Interesses:</p>

        <input type="checkbox" id="programacao" name="interesses" value="programacao">
        <label for="programacao">Programação</label>

        <input type="checkbox" id="jogos" name="interesses" value="jogos">
        <label for="jogos">Jogos</label>

        <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
        <label for="tecnologia">Tecnologia</label>


        <label for="cidade">Cidade:</label>
        <select id="cidade" name="cidade" required>
            <option value="">Selecione uma cidade</option>
            <option value="candiba">Candiba</option>
            <option value="guanambi">Guanambi</option>
            <option value="caetite">Caetité</option>
            <option value="barreiras">Barreiras</option>
        </select>


        <label for="quantidade">Quantidade de produtos:</label>
        <input 
            type="number" 
            id="quantidade" 
            name="quantidade"
            min="1"
            max="20"
            required
        >


        <label for="observacoes">Observações:</label>
        <textarea id="observacoes" name="observacoes"></textarea>


        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
